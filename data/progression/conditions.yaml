  checkitem ITEM_MEGA_RING: "holds the Mega Ring (Mart: Mega services)"
  checkitem ITEM_WAILMER_PAIL: "holds the Wailmer Pail (berry trees: watering)"
  checkfieldmove FIELD_MOVE_CUT: can use Cut (Cut trees)
  FLAG_RECEIVED_HM_CUT: later           # Cut: region 2 (Stone Badge)
  CheckChampionsLinkBattleParty: link battle party is legal (Cable Club)
  CenterGuideHasStaticLegendaryLead: the guide has a legendary to point to
  CountDeliverableLegendaryRelics: the nurse holds relics for the player
  Special_HasMoveToRelearn: the chosen Pokemon has a move to relearn
  IsSelectedMonEgg: the chosen Pokemon is an Egg
  GetNumMovesSelectedMonHas: the chosen Pokemon's move count (Rotom)
  getpartysize: party size (move relearner)
  PlayerHasBerries: has a Berry to plant (berry trees)
  CountRotomInParty: has a Rotom (Rotom appliances)
  DoesRotomKnowSpecialMove: the Rotom knows its form move
  HasAllHoennMons: "later: post-game (Birch's Hoenn Pokedex reward)"
  checkitemspace: the Bag has room (every gift)

