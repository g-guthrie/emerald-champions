# What every condition on a story-machine map is. `story.py conditions` finds each place a
# script, object or trigger tests something; `story.py check` fails the build on any subject
# not classified here. Classes:
#
#   story    old progress state; becomes the story step. Value: the step it means
#            (a flag: set once the story reaches that step; a var: value -> step).
#   window   object or trigger presence; becomes a window in story.yaml.
#   gate     a real requirement the player meets, other than story order. Each use must
#            sit on an entity whose `requires` names it, so it shows in the story report.
#   once     a one-time gift or event of an entity: its `once` done flag.
#   memory   a one-time line ("I already told you"); no effect on the game.
#   engine   a system switch the engine itself reads; kept, set by its step's scene.
#   scratch  scene-local working state (temp vars and flags), cleared on map load.
#   choice   the player's own answer (yes/no, menus, starter pick).
#   outcome  how a scene the player plays ended (battle won, tutorial finished).
#   flavor   changes only what is said, never what happens (greetings, ratings).
#   effect   runs code; any result is not a gate (UI, animation, healing, buffering text).
#   later    belongs to a later region; converted with it. Value: that region.

