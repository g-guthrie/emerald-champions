<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fallarbor Town</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Fallarbor Town</h2>
      <div class="loc-grid">
        <div class="items">
          <h3>ITEMS</h3>
          <ul>
            <li class="hidden">Upgrade <em>(hidden)</em></li>
          </ul>
        </div>
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/FallarborTown.png" alt="Fallarbor Town">
            <div class="pin" style="left:77.5%; top:72.0%">Pokémart</div>
            <div class="pin" style="left:72.5%; top:32.0%">Pokémon Center</div>
            <div class="pin" style="left:32.5%; top:82.0%">House</div>
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Great Ball</td><td class="num">₽300</td></tr>
            <tr><td>Super Potion</td><td class="num">₽700</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
          </table>
        </div>
      </div>
    </div>



  </div>
  <div class="folio"><div class="n">136</div><div class="ball"></div></div>
</section>
</body>
</html>
