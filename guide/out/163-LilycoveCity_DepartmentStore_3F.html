<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Lilycove City Department Store 3F</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Lilycove City Department Store 3F</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/LilycoveCity_DepartmentStore_3F.png" alt="Lilycove City Department Store 3F">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Quick Ball</td><td class="num">₽600</td></tr>
            <tr><td>Dusk Ball</td><td class="num">₽600</td></tr>
            <tr><td>Timer Ball</td><td class="num">₽600</td></tr>
            <tr><td>Repeat Ball</td><td class="num">₽600</td></tr>
            <tr><td>Luxury Ball</td><td class="num">—</td></tr>
          </table>
        </div>
      </div>
    </div>



    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/LilycoveCity_DepartmentStore_3F-view.png" alt="LilycoveCity_DepartmentStore_3F">
        <div class="cap">LilycoveCity_DepartmentStore_3F</div>
      </div>
      <p>LilycoveCity_DepartmentStore_3F.</p>
    </div>
  </div>
  <div class="folio"><div class="n">163</div><div class="ball"></div></div>
</section>
</body>
</html>
