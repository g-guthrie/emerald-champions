<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Ever Grande City Pokemon League 1F</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Ever Grande City Pokemon League 1F</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/EverGrandeCity_PokemonLeague_1F.png" alt="Ever Grande City Pokemon League 1F">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Hyper Potion</td><td class="num">₽1500</td></tr>
            <tr><td>Max Potion</td><td class="num">₽2500</td></tr>
            <tr><td>Full Heal</td><td class="num">₽600</td></tr>
            <tr><td>Revive</td><td class="num">₽2000</td></tr>
          </table>
        </div>
      </div>
    </div>



    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/EverGrandeCity_PokemonLeague_1F-view.png" alt="EverGrandeCity_PokemonLeague_1F">
        <div class="cap">EverGrandeCity_PokemonLeague_1F</div>
      </div>
      <p>EverGrandeCity_PokemonLeague_1F.</p>
    </div>
  </div>
  <div class="folio"><div class="n">150</div><div class="ball"></div></div>
</section>
</body>
</html>
