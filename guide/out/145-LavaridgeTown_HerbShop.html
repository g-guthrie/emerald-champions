<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Lavaridge Town Herb Shop</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Lavaridge Town Herb Shop</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/LavaridgeTown_HerbShop.png" alt="Lavaridge Town Herb Shop">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Energy Powder</td><td class="num">₽500</td></tr>
            <tr><td>Energy Root</td><td class="num">₽1200</td></tr>
            <tr><td>Heal Powder</td><td class="num">₽300</td></tr>
            <tr><td>Revival Herb</td><td class="num">₽2800</td></tr>
          </table>
        </div>
      </div>
    </div>



  </div>
  <div class="folio"><div class="n">145</div><div class="ball"></div></div>
</section>
</body>
</html>
