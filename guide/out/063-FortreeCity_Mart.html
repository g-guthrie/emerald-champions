<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fortree City Mart</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Fortree City Mart</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/FortreeCity_Mart.png" alt="Fortree City Mart">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Great Ball</td><td class="num">₽300</td></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Super Potion</td><td class="num">₽700</td></tr>
            <tr><td>Hyper Potion</td><td class="num">₽1500</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
            <tr><td>Revive</td><td class="num">₽2000</td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="tbl roster">
      <h3>TRAINERS HERE</h3>
      <table>
        <tr><th>TRAINER</th><th>CLASS</th><th style="text-align:right">CAP</th><th>TEAM</th></tr>
            <tr><td>Spenser Fortree</td><td>brain</td><td class="num">60</td><td class="team">Crobat, Slaking, Lapras, Arcanine, Venusaur, Mawile</td></tr>
      </table>
    </div>

  </div>
  <div class="folio"><div class="n">63</div><div class="ball"></div></div>
</section>
</body>
</html>
