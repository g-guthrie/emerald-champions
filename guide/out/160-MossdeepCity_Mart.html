<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Mossdeep City Mart</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Mossdeep City Mart</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/MossdeepCity_Mart.png" alt="Mossdeep City Mart">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Net Ball</td><td class="num">₽600</td></tr>
            <tr><td>Dive Ball</td><td class="num">₽600</td></tr>
            <tr><td>Hyper Potion</td><td class="num">₽1500</td></tr>
            <tr><td>Full Heal</td><td class="num">₽600</td></tr>
            <tr><td>Revive</td><td class="num">₽2000</td></tr>
            <tr><td>Timer Ball</td><td class="num">₽600</td></tr>
            <tr><td>Quick Ball</td><td class="num">₽600</td></tr>
          </table>
        </div>
      </div>
    </div>



  </div>
  <div class="folio"><div class="n">160</div><div class="ball"></div></div>
</section>
</body>
</html>
