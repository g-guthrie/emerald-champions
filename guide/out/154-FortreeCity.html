<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fortree City</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Fortree City</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/FortreeCity.png" alt="Fortree City">
            <div class="pin" style="left:13.8%; top:27.0%">Pokémon Center</div>
            <div class="pin" style="left:26.2%; top:12.0%">House</div>
            <div class="pin" style="left:56.2%; top:52.0%">Gym</div>
            <div class="pin" style="left:11.2%; top:67.0%">Pokémart</div>
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Great Ball</td><td class="num">₽300</td></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Super Potion</td><td class="num">₽700</td></tr>
            <tr><td>Hyper Potion</td><td class="num">₽1500</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
            <tr><td>Revive</td><td class="num">₽2000</td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="strip ">
      <h4>FORTREE CITY END TO END</h4>
      <img src="../assets/captures/FortreeCity-pan.png" alt="Fortree City">
      <div class="cap">3 viewpoints, stitched in order of travel</div>
    </div>


  </div>
  <div class="folio"><div class="n">154</div><div class="ball"></div></div>
</section>
</body>
</html>
