<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Oldale Town</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Oldale Town</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/OldaleTown.png" alt="Oldale Town">
            <div class="pin" style="left:27.5%; top:32.0%">House</div>
            <div class="pin" style="left:32.5%; top:77.0%">Pokémon Center</div>
            <div class="pin" style="left:72.5%; top:27.0%">Pokémart</div>
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Potion</td><td class="num">₽200</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
          </table>
        </div>
      </div>
    </div>



    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/OldaleTown-view.png" alt="OldaleTown">
        <div class="cap">OldaleTown</div>
      </div>
      <p>OldaleTown.</p>
    </div>
  </div>
  <div class="folio"><div class="n">185</div><div class="ball"></div></div>
</section>
</body>
</html>
