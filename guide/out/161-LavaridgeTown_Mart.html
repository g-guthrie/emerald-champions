<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Lavaridge Town Mart</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Lavaridge Town Mart</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/LavaridgeTown_Mart.png" alt="Lavaridge Town Mart">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Great Ball</td><td class="num">₽300</td></tr>
            <tr><td>Super Potion</td><td class="num">₽700</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
            <tr><td>Burn Heal</td><td class="num">₽200</td></tr>
            <tr><td>Revive</td><td class="num">₽2000</td></tr>
          </table>
        </div>
      </div>
    </div>



    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/LavaridgeTown_Mart-view.png" alt="LavaridgeTown_Mart">
        <div class="cap">LavaridgeTown_Mart</div>
      </div>
      <p>LavaridgeTown_Mart.</p>
    </div>
  </div>
  <div class="folio"><div class="n">161</div><div class="ball"></div></div>
</section>
</body>
</html>
