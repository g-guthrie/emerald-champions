<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Battle Frontier Mart</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Battle Frontier Mart</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/BattleFrontier_Mart.png" alt="Battle Frontier Mart">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Ultra Ball</td><td class="num">₽600</td></tr>
            <tr><td>Hyper Potion</td><td class="num">₽1500</td></tr>
            <tr><td>Full Heal</td><td class="num">₽600</td></tr>
            <tr><td>Max Repel</td><td class="num">₽900</td></tr>
            <tr><td>Quick Ball</td><td class="num">₽600</td></tr>
            <tr><td>Dusk Ball</td><td class="num">₽600</td></tr>
            <tr><td>Timer Ball</td><td class="num">₽600</td></tr>
            <tr><td>Repeat Ball</td><td class="num">₽600</td></tr>
            <tr><td>Dive Ball</td><td class="num">₽600</td></tr>
            <tr><td>Luxury Ball</td><td class="num">—</td></tr>
          </table>
        </div>
      </div>
    </div>



    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/BattleFrontier_Mart-view.png" alt="BattleFrontier_Mart">
        <div class="cap">BattleFrontier_Mart</div>
      </div>
      <p>BattleFrontier_Mart.</p>
    </div>
  </div>
  <div class="folio"><div class="n">140</div><div class="ball"></div></div>
</section>
</body>
</html>
