<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Petalburg City Mart</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Petalburg City Mart</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/PetalburgCity_Mart.png" alt="Petalburg City Mart">
            
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Poké Ball</td><td class="num">₽100</td></tr>
            <tr><td>Potion</td><td class="num">₽200</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
            <tr><td>Heal Ball</td><td class="num">₽600</td></tr>
            <tr><td>Net Ball</td><td class="num">₽600</td></tr>
            <tr><td>Nest Ball</td><td class="num">₽600</td></tr>
          </table>
        </div>
      </div>
    </div>


    <div class="event">
      <h4>Event 1</h4>
      <div class="shot">
        <img src="../assets/captures/petalburg-mart-counter.png" alt="The Mart counter">
        <div class="cap">The Mart counter</div>
      </div>
      <p>The Mart counter.</p>
    </div>
  </div>
  <div class="folio"><div class="n">174</div><div class="ball"></div></div>
</section>
</body>
</html>
