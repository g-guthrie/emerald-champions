<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Verdanturf Town</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
<section class="page">
  <div class="sheet">
    <div class="masthead">
      <div class="plaque"><img src="../assets/logo.png" alt="Emerald Champions"></div>
      <div class="kicker"><b>OFFICIAL</b> FIELD GUIDE</div>
    </div>

    <div class="location">
      <h2>Verdanturf Town</h2>
      <div class="loc-grid">
        <div class="mapplate">
          <div class="plate">
            <img src="../assets/maps/VerdanturfTown.png" alt="Verdanturf Town">
            <div class="pin" style="left:62.5%; top:12.0%">Pokémart</div>
            <div class="pin" style="left:82.5%; top:12.0%">Pokémon Center</div>
            <div class="pin" style="left:52.5%; top:67.0%">House</div>
          </div>
        </div>
        <div class="tbl mart">
          <h3>POKÉMART</h3>
          <table>
            <tr><th>ITEM</th><th style="text-align:right">PRICE</th></tr>
            <tr><td>Great Ball</td><td class="num">₽300</td></tr>
            <tr><td>Nest Ball</td><td class="num">₽600</td></tr>
            <tr><td>Super Potion</td><td class="num">₽700</td></tr>
            <tr><td>Antidote</td><td class="num">₽200</td></tr>
            <tr><td>Paralyze Heal</td><td class="num">—</td></tr>
            <tr><td>Awakening</td><td class="num">₽200</td></tr>
            <tr><td>Burn Heal</td><td class="num">₽200</td></tr>
            <tr><td>Ice Heal</td><td class="num">₽200</td></tr>
            <tr><td>Luxury Ball</td><td class="num">—</td></tr>
            <tr><td>Fluffy Tail</td><td class="num">₽100</td></tr>
          </table>
        </div>
      </div>
    </div>



  </div>
  <div class="folio"><div class="n">219</div><div class="ball"></div></div>
</section>
</body>
</html>
