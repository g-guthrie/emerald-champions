name: Deep source audit bundle

on:
  push:
    branches:
      - audit/deep-source-review-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build tracked-source bundle
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='docs/local_mdbook' \
            --exclude='pokeemerald-release.gba' \
            --exclude='*.gba' \
            --exclude='*.elf' \
            --exclude='sound' \
            --exclude='tools' \
            -czf emerald-champions-audit-source.tgz \
            .github \
            Makefile \
            config.mk \
            asm \
            constants \
            data \
            docs \
            graphics/object_events/pics/people/cynthia.png \
            graphics/trainers/front_pics/cynthia.png \
            include \
            migration_scripts \
            scripts \
            src \
            test \
            trainer_rules.mk
          sha256sum emerald-champions-audit-source.tgz > emerald-champions-audit-source.tgz.sha256

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: emerald-champions-audit-source-e2d40e0-complete-gates
          path: |
            emerald-champions-audit-source.tgz
            emerald-champions-audit-source.tgz.sha256
          if-no-files-found: error
          retention-days: 1
