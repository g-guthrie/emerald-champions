name: CI

on:
  push:
    branches:
      - main
      # Work branches get the same run as main, so a red build is known
      # before it lands rather than after.
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emerald-champions-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  # Keep this job name stable so it can be selected if branch protection is enabled.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            build-essential \
            gcc-arm-none-eabi \
            libmgba-dev \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Cache native build tools
        uses: actions/cache@v6
        with:
          path: |
            tools/bin2c/bin2c
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
            tools/mid2agb/mid2agb
            tools/patchelf/patchelf
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/wav2agb/wav2agb
          key: emerald-champions-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build Emerald Champions release ROM
        run: make -j"$(nproc)" release

      - name: Verify campaign, generated data, and ROM layout
        run: python3 scripts/verify_emerald_champions_release.py

      - name: ROM entrypoint smoke (first VBlank)
        run: tools/mgba/mgba-rom-test -l15 -ClogLevel.gba.dma=16 -S 5 pokeemerald-release.gba

      - name: Build once and run curated runtime gates
        run: python3 scripts/run_emerald_champions_runtime_gates.py --jobs "$(nproc)"

      - name: Report ROM identity
        run: |
          sha256sum pokeemerald-release.gba
          arm-none-eabi-size pokeemerald-release.elf

      # Every green build is a downloadable ROM: the .gba, the ELF for
      # symbolised crash reads, and the stamp that proves which sources built it.
      - name: Upload release ROM
        uses: actions/upload-artifact@v4
        with:
          name: emerald-champions-${{ github.sha }}
          path: |
            pokeemerald-release.gba
            pokeemerald-release.elf
            pokeemerald-release.inputs.json
          retention-days: 30
          if-no-files-found: error

  # Advisory: the pixel/runtime seam matrix depends on a host-compiled libmGBA
  # runner and a committed baseline that moves whenever a menu changes. It
  # reports on every run but does not block a merge; promote it to a required
  # check once it has stayed green for a few weeks.
  visual:
    name: visual
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            build-essential \
            gcc-arm-none-eabi \
            libmgba-dev \
            libnewlib-arm-none-eabi \
            libpng-dev \
            pkg-config \
            python3

      - name: Cache native build tools
        uses: actions/cache@v6
        with:
          path: |
            tools/bin2c/bin2c
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
            tools/mid2agb/mid2agb
            tools/patchelf/patchelf
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/wav2agb/wav2agb
          key: emerald-champions-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build deterministic visual-fixture ROM
        run: make -j"$(nproc)" BUILD_NAME=emerald-headless EC_HEADLESS_FIXTURES=1

      - name: Verify Inclement migration seam pixels and runtime states
        # Staged rollout: this gate compares against a committed pixel baseline.
        # Until docs/inclement_visual_runtime_baseline.json is generated by the
        # headless builder and committed, skip rather than fail every push.
        if: hashFiles('docs/inclement_visual_runtime_baseline.json') != ''
        run: python3 scripts/verify_emerald_champions_visual_runtime.py
