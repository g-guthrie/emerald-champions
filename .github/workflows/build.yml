name: CI

on:
  push:
    branches:
      - main
      - master
      - battle_engine
      - pokemon_expansion
      - item_expansion
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc
          ref: da598c1d918402c42c0c0d7128ba14567f3175e9

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
        # build-essential, git, and libpng-dev are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Engine verification
        run: make verify-static

      - name: Campaign and generated-data verification
        run: python3 scripts/verify_verdant.py

      - name: Agbcc
        run: make -j"$(nproc)" all

      - name: Modern
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j"$(nproc)" all

      - name: ROM memory layouts
        run: |
          python3 scripts/check_rom_layout.py --elf pokeemerald.elf --rom pokeemerald.gba
          python3 scripts/check_rom_layout.py --elf pokeemerald_modern.elf --rom pokeemerald_modern.gba

      - name: ROM hashes
        run: sha256sum pokeemerald.gba pokeemerald_modern.gba
