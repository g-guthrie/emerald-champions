name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emerald-champions-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_VERSION: EMERALD
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  MODERN: 1
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  # Keep this job name stable: repository branch protection requires `build`.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache native build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
            tools/mid2agb/mid2agb
            tools/patchelf/patchelf
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/wav2agb/wav2agb
          key: emerald-champions-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build Emerald Champions ROM
        run: make -j"$(nproc)" all

      - name: Verify campaign, generated data, and ROM layout
        run: python3 scripts/verify_emerald_champions_release.py

      - name: Headless ROM boot smoke
        run: tools/mgba/mgba-rom-test -l15 -ClogLevel.gba.dma=16 -S 5 pokeemerald.gba

      - name: Run Emerald Champions runtime gates
        shell: bash
        run: |
          set -euo pipefail

          run_tests() {
            local filter="$1"
            rm -f pokeemerald-test.elf pokeemerald-test-headless.elf
            make -j"$(nproc)" check TESTS="$filter"
          }

          run_tests '*Champions'
          run_tests '*Eggs safely inherit*'
          run_tests 'Commander'
          run_tests 'test/save.c'
          run_tests 'test/battle/ai/ai_doubles.c'

      - name: Report ROM identity
        run: |
          sha256sum pokeemerald.gba
          arm-none-eabi-size pokeemerald.elf
