name: Full test-corpus compile

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emerald-champions-full-test-compile
  cancel-in-progress: true

env:
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  compile:
    name: full-test-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Cache native build tools
        uses: actions/cache@v6
        with:
          path: |
            tools/bin2c/bin2c
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
            tools/mid2agb/mid2agb
            tools/patchelf/patchelf
            tools/preproc/preproc
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/wav2agb/wav2agb
          key: emerald-champions-tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Compile and link every upstream test source
        run: |
          echo "test_c_files=$(find test -type f -name '*.c' | wc -l)"
          make -j"$(nproc)" pokeemerald-test.elf TESTS=''

      - name: Report full test ELF
        run: |
          sha256sum pokeemerald-test.elf
          arm-none-eabi-size pokeemerald-test.elf
